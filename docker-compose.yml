# Production / VPS — separate from mimir-api compose; both on the same host.
# Reach mimir-api via published host port:
#   API_URL=http://host.docker.internal:5000
# Usage: docker compose up --build -d   (or: npm run docker:up)

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mimir-bot
    env_file:
      - .env
    extra_hosts:
      # Linux: map host.docker.internal → host gateway (API on :5000)
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
